type: object
required:
  - _id
  - name
  - phoneNumber
  - email
  - isFavourite
  - contactType
  - userId
properties:
  _id:
    description: "Contact's unique identifier"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "Contact's phone number"
    type: string
    example: '+380930000000'
  email:
    description: "Contact's email"
    type: string
    example: 'example@example.com'
  isFavourite:
    description: 'Indicates whether the contact is marked as a favorite'
    type: boolean
    example: false
  contactType:
    type: string
    description: 'Defines the category of the contact'
    enum:
      - work
      - home
      - personal
    default: personal
    example: work
  userId:
    type: string
    description: 'Unique identifier of the user who owns the contact (MongoDB ObjectId)'
    example: 650f1b2a3c5d6e7f8a9b0c1d
  photo:
    description: "Link to contact's photo"
    type: string
    format: uri
    example: 'https://res.cloudinary.com/uqwgdu/image/upload/image.png'
